name: release

on:
  push:
    tags: ["v*"]

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check the tag matches the app version
        run: |
          v=$(grep -m1 -oP '^version = "\K[^"]+' Cargo.toml)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - name: Install the Android tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" > /dev/null
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Check the licence notices are up to date
        run: python3 tools/make_notices.py --check
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Test
        run: cargo test --lib
      - name: Decode the signing key
        env:
          PILLION_KEYSTORE_B64: ${{ secrets.PILLION_KEYSTORE_B64 }}
        run: echo "$PILLION_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pillion.jks"
      - name: Build the signed APK
        env:
          PILLION_ARM_ONLY: "1"
          PILLION_KEYSTORE: ${{ runner.temp }}/pillion.jks
          PILLION_KEYSTORE_PASSWORD: ${{ secrets.PILLION_KEYSTORE_PASSWORD }}
        run: bash android/build_android.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp Pillion.apk "Pillion-$version.apk"
          python3 - "$version" <<'PY' > notes.md
          import re, sys
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[' + re.escape(sys.argv[1]) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)', text, re.S | re.M)
          print(m.group(1).strip() if m else '')
          PY
          # The speech engine in the APK includes GPL code, so its source goes out with it. The pins match build_android.sh's version.
          curl -fsSL -o sherpa-onnx-1.13.8-source.tar.gz https://github.com/k2-fsa/sherpa-onnx/archive/refs/tags/v1.13.8.tar.gz
          curl -fsSL -o espeak-ng-ed530aa-source.zip https://github.com/csukuangfj/espeak-ng/archive/ed530aa113046142eb5115cf2fc9157854d0ffe1.zip
          echo "e4e262cbe34f7fe21f91f1ba3397f2728e1f30eafbae7853f2b753a9ed13f0dd  espeak-ng-ed530aa-source.zip" | sha256sum -c
          curl -fsSL -o piper-phonemize-f3ff95a-source.zip https://github.com/csukuangfj/piper-phonemize/archive/f3ff95afc03640bc1399e113e83361192a2fafb4.zip
          gh release create "$GITHUB_REF_NAME" "Pillion-$version.apk" sherpa-onnx-1.13.8-source.tar.gz espeak-ng-ed530aa-source.zip piper-phonemize-f3ff95a-source.zip --title "Pillion $version" --notes-file notes.md
